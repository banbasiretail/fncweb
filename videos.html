<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free News Club — Get the App</title>
<style>
  :root{
    --navy:#062565;
    --navy-deep:#04173f;
    --gold:#FFCA0A;
    --gold-soft:#fff4c4;
    --paper:#f6f7fb;
    --white:#ffffff;
    --ink:#0a1230;
    --muted:#6b7290;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--navy);
    color:var(--white);
    min-height:100svh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }

  /* Ambient broadcast rings behind hero */
  .rings{
    position:absolute;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    width:900px;
    height:900px;
    pointer-events:none;
    z-index:0;
  }
  .rings span{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(255,202,10,0.14);
  }
  .rings span:nth-child(1){inset:170px;}
  .rings span:nth-child(2){inset:80px;}
  .rings span:nth-child(3){inset:0;}

  header{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1.6rem 6vw 0;
    font-family:var(--mono);
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
  }
  header .dot{
    color:var(--gold);
  }

  main{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:3rem 6vw 4rem;
  }

  .icon-frame{
    width:150px;
    height:150px;
    border-radius:34px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 0 80px -10px rgba(255,202,10,0.25);
    margin-bottom:1.8rem;
    animation:rise 0.7s cubic-bezier(.2,.9,.25,1) both;
  }
  .icon-frame img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(18px) scale(0.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  h1{
    font-size:clamp(2.1rem,5.5vw,3.2rem);
    line-height:1.05;
    letter-spacing:-0.02em;
    margin:0 0 0.7rem;
    font-weight:800;
  }
  h1 .accent{color:var(--gold);}

  .tagline{
    font-size:1.05rem;
    color:rgba(255,255,255,0.68);
    max-width:36ch;
    margin:0 0 2.4rem;
    line-height:1.55;
  }

  .store-row{
    display:flex;
    gap:0.9rem;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:0.5rem;
  }

  .store-btn{
    display:flex;
    align-items:center;
    gap:0.65rem;
    background:var(--white);
    color:var(--navy);
    text-decoration:none;
    padding:0.75rem 1.3rem;
    border-radius:12px;
    font-weight:700;
    font-size:0.95rem;
    border:1px solid transparent;
    transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    box-shadow:0 8px 20px -8px rgba(0,0,0,0.4);
  }
  .store-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 26px -10px rgba(0,0,0,0.5);
  }
  .store-btn.android{background:var(--gold); color:var(--navy-deep);}
  .store-btn.ios{background:var(--white); color:var(--navy);}
  .store-btn svg{width:22px; height:22px; flex-shrink:0;}
  .store-btn .btn-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.15;
  }
  .store-btn .btn-text small{
    font-size:0.62rem;
    font-weight:500;
    opacity:0.7;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .store-btn .btn-text span{font-size:0.95rem;}

  .policy-link{
    margin-top:2.2rem;
    font-size:0.85rem;
  }
  .policy-link a{
    color:rgba(255,255,255,0.6);
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:1px;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .policy-link a:hover{
    color:var(--gold);
    border-color:var(--gold);
  }

  .contact-section{
    position:relative;
    z-index:2;
    width:100%;
    max-width:480px;
    margin:0 auto 1rem;
    padding:1.6rem 1.8rem;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    backdrop-filter:blur(4px);
  }
  .contact-section h2{
    margin:0 0 1rem;
    font-size:0.72rem;
    font-family:var(--mono);
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .contact-row{
    display:flex;
    align-items:center;
    gap:0.7rem;
    justify-content:center;
    margin-bottom:0.85rem;
  }
  .contact-row:last-child{margin-bottom:0;}
  .contact-row svg{
    width:20px;
    height:20px;
    flex-shrink:0;
    color:var(--gold);
  }
  .contact-row a{
    color:var(--white);
    text-decoration:none;
    font-size:0.98rem;
    font-weight:600;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:1px;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .contact-row a:hover{
    color:var(--gold);
    border-color:var(--gold);
  }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:1.4rem 1.5rem 2rem;
    font-size:0.75rem;
    color:rgba(255,255,255,0.35);
    font-family:var(--mono);
  }

  @media (max-width:420px){
    .store-row{flex-direction:column; width:100%; max-width:280px;}
    .store-btn{justify-content:center;}
  }
</style>
</head>
<body>

<div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>

<header>

</main>

</body>
</html>
